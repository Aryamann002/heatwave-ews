services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: heatwave
      POSTGRES_USER: heatwave
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U heatwave -d heatwave" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://heatwave@postgres:5432/heatwave
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AUTH_MODE: ${AUTH_MODE:-demo}
      HEATWATCH_SESSION_SECRET: ${HEATWATCH_SESSION_SECRET:-}
      HEATWATCH_USERS_JSON: ${HEATWATCH_USERS_JSON:-}
      CAP_STATUS: ${CAP_STATUS:-Test}
      CAP_SENDER: ${CAP_SENDER:-heatwatch-demo@example.invalid}
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "8543:8000"
    volumes:
      - ./data:/app/data

  pipeline:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [ "python", "-m", "pipeline" ]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://heatwave@postgres:5432/heatwave
      ALLOW_UNPINNED_POPULATION: ${ALLOW_UNPINNED_POPULATION:-0}
      CDSAPI_URL: ${CDSAPI_URL:-}
      CDSAPI_KEY: ${CDSAPI_KEY:-}
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8543}
    depends_on:
      backend:
        condition: service_healthy
      pipeline:
        condition: service_started
    ports:
      - "5173:5173"

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "while true; do sleep 21660; python -m pipeline; done"]
    depends_on:
      pipeline:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://heatwave@postgres:5432/heatwave
      ALLOW_UNPINNED_POPULATION: ${ALLOW_UNPINNED_POPULATION:-0}
      CDSAPI_URL: ${CDSAPI_URL:-}
      CDSAPI_KEY: ${CDSAPI_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
